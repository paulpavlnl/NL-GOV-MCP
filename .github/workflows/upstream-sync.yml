name: Upstream sync (WAINUTAI)

# Brings new work from the original repo (WAINUTAI/NL-GOV-MCP) into this fork, every day (and on demand),
# at the owner's request: it merges upstream main into the branch `upstream-sync` and runs type-check,
# build and all tests (the fork's own tests included) and checks the fork's hooks (docs/FORK.md). When all
# of that passes, the merge goes to main automatically (Render then deploys) and a note goes to the
# Workflowy Inbox. When the merge conflicts, a test fails or a hook is missing, nothing reaches main: the
# branch and a pull request (or, on a conflict, the run summary) say what is wrong, and a task goes to the
# Workflowy Inbox so the daily round reports it and Claude can repair it. Secret: WORKFLOWY_API_KEY.

on:
  schedule:
    - cron: "17 4 * * *" # every day 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/WAINUTAI/NL-GOV-MCP.git
  BRANCH: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main
          count=$(git rev-list --count HEAD..upstream/main)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          git log --no-merges --format='- %s (%h, %as)' HEAD..upstream/main > /tmp/commits.md
          echo "Nieuwe upstream-commits: $count"

      - name: Merge upstream into ${{ env.BRANCH }}
        id: merge
        if: steps.fetch.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          if git merge --no-edit upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.merge.outputs.conflict == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Type-check, build and test
        id: test
        if: steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        run: |
          set -o pipefail
          { npm ci && npm run check && npm run build && npm test; } 2>&1 | tail -n 60 > /tmp/test.log

      - name: Check fork hooks (EU module, docs/FORK.md)
        id: fork
        if: steps.merge.outputs.conflict == 'false'
        run: |
          missing=""
          grep -q 'registerEuForkTools(server' src/tools.ts || missing="$missing src/tools.ts(registerEuForkTools)"
          grep -q 'registerNlGovAsk(server, { euTekstResult,' src/tools.ts || missing="$missing src/tools.ts(euTekstResult)"
          grep -q 'const { euTekstResult } = deps;' src/router/nl-gov-ask.ts || missing="$missing src/router/nl-gov-ask.ts(euTekstResult)"
          grep -q 'LidoSource.artikelFallback(value, artikel)' src/sources/lido.ts || missing="$missing src/sources/lido.ts(artikelFallback)"
          grep -q 'installHallucinatieBeveiliging(server)' src/server.ts || missing="$missing src/server.ts(installHallucinatieBeveiliging)"
          for f in src/fork/hallucinatie.ts src/fork/foutlog.ts data/bekende-valkuilen.json src/fork/eu-tekst.ts src/fork/eu-bron.ts src/fork/eu-tools.ts src/fork/lido-artikel.ts src/fork/lido-relaties.ts; do [ -f "$f" ] || missing="$missing $f"; done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Merge into main when everything passes
        id: auto
        if: steps.merge.outputs.conflict == 'false' && steps.test.outcome == 'success' && steps.fork.outputs.missing == ''
        env:
          COUNT: ${{ steps.fetch.outputs.count }}
          WORKFLOWY_API_KEY: ${{ secrets.WORKFLOWY_API_KEY }}
        run: |
          git push origin HEAD:main
          echo "merged=true" >> "$GITHUB_OUTPUT"
          node scripts/meld-workflowy.mjs "✅ NL-GOV-MCP: $COUNT upstream-update(s) van WAINUTAI automatisch samengevoegd (tests en fork-koppelingen in orde)" "$(cat /tmp/commits.md)
          Render deployt automatisch. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

      - name: Warn in Workflowy when it cannot be merged automatically
        if: steps.fetch.outputs.count != '0' && steps.auto.outputs.merged != 'true'
        env:
          COUNT: ${{ steps.fetch.outputs.count }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          FORK_MISSING: ${{ steps.fork.outputs.missing }}
          WORKFLOWY_API_KEY: ${{ secrets.WORKFLOWY_API_KEY }}
        run: |
          if [ "$CONFLICT" = "true" ]; then wat="merge-conflict in: $(tr '\n' ' ' < /tmp/conflicts.txt)";
          elif [ "$TEST_OUTCOME" != "success" ]; then wat="type-check, build of tests mislukt";
          else wat="fork-koppelingen ontbreken na de merge:$FORK_MISSING"; fi
          node scripts/meld-workflowy.mjs "⚠️ NL-GOV-MCP: $COUNT upstream-update(s) van WAINUTAI niet automatisch samengevoegd ($wat)" "Opdracht voor Claude: herstel de upstream-sync van NL-GOV-MCP (paulpavlnl/NL-GOV-MCP, branch upstream-sync, docs/FORK.md).
          Wat: $wat
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          $( [ -f /tmp/test.log ] && tail -n 30 /tmp/test.log )

          Nieuwe upstream-commits:
          $(cat /tmp/commits.md)" || true

      - name: Push branch and open or update pull request
        if: steps.merge.outputs.conflict == 'false' && steps.auto.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          FORK_MISSING: ${{ steps.fork.outputs.missing }}
          COUNT: ${{ steps.fetch.outputs.count }}
        run: |
          git push --force origin "$BRANCH"
          if [ "$TEST_OUTCOME" = "success" ]; then
            status="Type-check, build en tests: **geslaagd**."
          else
            status="Type-check, build of tests: **mislukt**. Laatste regels:"$'\n\n```\n'"$(cat /tmp/test.log)"$'\n```'
          fi
          {
            echo "WAINUTAI/NL-GOV-MCP heeft $COUNT nieuwe commit(s) die nog niet in deze fork staan. Deze PR voegt ze samen met main; de merge gaf geen conflicten."
            echo
            echo "$status"
            echo
            if [ -n "$FORK_MISSING" ]; then
              echo "**Let op: koppelingen van de eigen EU-module ontbreken na de merge:**$FORK_MISSING. Zet ze terug volgens docs/FORK.md voordat je merget."
              echo
            fi
            echo "## Nieuwe upstream-commits"
            cat /tmp/commits.md
            echo
            echo "Na het mergen deployt Render automatisch."
          } > /tmp/body.md
          title="Upstream: $COUNT nieuwe commit(s) van WAINUTAI"
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file /tmp/body.md
          else
            gh pr create --head "$BRANCH" --base main --title "$title" --body-file /tmp/body.md
          fi

      - name: Open or update issue on merge conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.fetch.outputs.count }}
        run: |
          {
            echo "WAINUTAI/NL-GOV-MCP heeft $COUNT nieuwe commit(s), maar die botsen met wijzigingen in deze fork. Ze moeten met de hand worden samengevoegd."
            echo
            echo "## Bestanden met conflicten"
            sed 's/^/- /' /tmp/conflicts.txt
            echo
            echo "## Nieuwe upstream-commits"
            cat /tmp/commits.md
          } > /tmp/body.md
          title="Upstream-wijzigingen met conflicten ($COUNT commits)"
          # Issues staan in deze fork uit: dan de melding in de samenvatting van de run (en de run faalt niet).
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" = "true" ]; then
            issue=$(gh issue list --state open --search "Upstream-wijzigingen met conflicten in:title" --json number --jq '.[0].number')
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --title "$title" --body-file /tmp/body.md
            else
              gh issue create --title "$title" --body-file /tmp/body.md
            fi
          else
            { echo "## $title"; echo; cat /tmp/body.md; } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=$title::Upstream-commits botsen met de fork; zie de samenvatting van deze run (Issues staan uit in deze repo)."
          fi
